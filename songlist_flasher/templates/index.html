<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Songlist Flasher</title>
<style>
  body { font-family: sans-serif; margin: 1.5rem; background:#111; color:#eee; }
  h1 { font-size: 1.2rem; }
  #log { background:#000; color:#0f8; padding:0.75rem; height:300px; overflow-y:auto;
         white-space:pre-wrap; font-family:monospace; font-size:0.85rem; border-radius:6px; }
  button { padding:0.5rem 1rem; font-size:1rem; margin-left:0.5rem; }
  button[disabled] { opacity:0.5; }
  .ok { color:#4caf50; font-weight:bold; }
  .fail { color:#f44336; font-weight:bold; }
  .hint { display:block; margin-top:0.6rem; font-size:0.85rem; color:#aaa; }
</style>
</head>
<body>
<h1>Setlist aktualisieren</h1>
<p>Ziel-Gerät: {{ device_ip or "(keine IP konfiguriert -- bitte im Konfigurations-Tab des Add-ons eintragen)" }}</p>
<form id="f">
  <input type="file" name="setlist" accept=".xlsx,.csv" required>
  <button id="go" type="submit">Aktualisieren</button>
  <label class="hint"><input type="checkbox" name="clean" value="1">
    Build-Verzeichnis vorher leeren (bei Compile-Fehlern; dauert deutlich länger)</label>
</form>
<p id="status"></p>
<pre id="log"></pre>
<script>
const form = document.getElementById('f');
const log = document.getElementById('log');
const status = document.getElementById('status');
const go = document.getElementById('go');

// Ein Build dauert leicht 20 Minuten. Damit ein Reload (oder ein zweiter
// Browser) den Fortschritt nicht verliert, hängen wir uns an den laufenden
// Job an, statt einen zweiten Build zu starten.
function attach(jobId) {
  go.disabled = true;
  status.textContent = 'Build läuft ...';
  const es = new EventSource('stream/' + jobId);
  es.onmessage = (ev) => {
    log.textContent += ev.data + '\n';
    log.scrollTop = log.scrollHeight;
  };
  es.addEventListener('done', (ev) => {
    es.close();
    go.disabled = false;
    if (ev.data === 'ok') {
      status.innerHTML = '<span class="ok">Fertig -- Display aktualisiert.</span>';
    } else {
      status.innerHTML = '<span class="fail">Fehler -- siehe Log oben.</span>';
    }
  });
  es.onerror = () => {
    es.close();
    go.disabled = false;
    status.innerHTML = '<span class="fail">Verbindung zum Log verloren -- '
      + 'Seite neu laden, der Build läuft weiter.</span>';
  };
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  log.textContent = '';
  status.textContent = '';
  go.disabled = true;
  let res, body;
  try {
    res = await fetch('upload', { method: 'POST', body: new FormData(form) });
    body = await res.json();
  } catch (err) {
    go.disabled = false;
    status.innerHTML = '<span class="fail">Upload fehlgeschlagen: ' + err + '</span>';
    return;
  }
  if (!res.ok) {
    status.innerHTML = '<span class="fail">' + body.error + '</span>';
    if (body.job) attach(body.job); else go.disabled = false;
    return;
  }
  attach(body.job);
});

fetch('current').then(r => r.json()).then(b => { if (b.job) attach(b.job); });
</script>
</body>
</html>
