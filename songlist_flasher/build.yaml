# trixie (Debian 13) statt bookworm: bookworm liefert nur Python 3.11, und
# esphome >= 2026.7 verlangt >= 3.12. Mit bookworm installierte pip stillschweigend
# das alte 2026.6.5, dessen OTA-Client das Display nicht flashen konnte.
build_from:
  amd64: ghcr.io/home-assistant/amd64-base-debian:trixie
  aarch64: ghcr.io/home-assistant/aarch64-base-debian:trixie
